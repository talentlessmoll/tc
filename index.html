<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LTC PayMent Test</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { background: #1e293b; padding: 2rem; border-radius: 12px; text-align: center; width: 350px; }
        input { width: 100%; padding: 10px; margin-bottom: 10px; border-radius: 5px; border: none; box-sizing: border-box; }
        button { background: #3b82f6; color: white; border: none; padding: 10px; width: 100%; border-radius: 5px; cursor: pointer; }
        .status-box { margin-top: 15px; display: none; padding: 10px; background: #334155; border-radius: 5px; }
    </style>
</head>
<body>

<div class="container">
    <h2>LTC Checkout</h2>
    <input type="text" id="customerContact" placeholder="Email or Phone">
    <button id="payBtn">Proceed to Payment</button>

    <div id="statusBox" class="status-box">
        Status: <span id="statusText" style="color: #fbbf24;">pending</span>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://itszjuzkyhmjuljikqpd.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml0c3pqdXpreWhtanVsamlrcXBkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA2Njg3NDIsImV4cCI6MjA4NjI0NDc0Mn0.cRswsDZMds0BshADiSlNXTjoi75HrtGSElSR89BUcpU';
    
    // Rename variable to avoid conflict with the library name
    const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const payBtn = document.getElementById('payBtn');

    payBtn.addEventListener('click', async () => {
        const contact = document.getElementById('customerContact').value;
        if (!contact) return alert("Enter contact info");

        console.log("Attempting to insert...");

        const { data, error } = await client
            .from('orders')
            .insert([{ 
                customer_contact: contact, 
                status: 'pending',
                pack_details: 'Litecoin Test' 
            }])
            .select();

        if (error) {
            console.error("Error:", error);
            alert("Error: " + error.message);
            return;
        }

        console.log("Inserted successfully:", data);
        document.getElementById('statusBox').style.display = 'block';

        // Start listening for changes to this specific order
        client
            .channel('any')
            .on('postgres_changes', { 
                event: 'UPDATE', 
                schema: 'public', 
                table: 'orders', 
                filter: `id=eq.${data[0].id}` 
            }, payload => {
                console.log('Change received!', payload);
                const newStatus = payload.new.status;
                document.getElementById('statusText').innerText = newStatus;
                if (newStatus === 'finished') {
                    document.getElementById('statusText').style.color = '#4ade80';
                    alert("Payment Verified!");
                }
            })
            .subscribe();

        // Open the payment link
        window.open("https://nowpayments.io/payment/?iid=5182935515", "_blank");
        payBtn.innerText = "Waiting for Payment...";
    });
</script>

</body>
</html>
